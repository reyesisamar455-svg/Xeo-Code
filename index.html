<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Archivos Virtual con Ejecución</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background-color: #1a1a1e;
            border-right: 1px solid #29292e;
            display: flex;
            flex-direction: column;
        }
        #toolbar {
            padding: 10px;
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #29292e;
            background-color: #141416;
        }
        .btn {
            background-color: #29292e;
            color: #e1e1e6;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #3a3a42;
        }
        .btn-play {
            background-color: #00875f;
            color: white;
        }
        .btn-play:hover {
            background-color: #00a372;
        }
        .btn-delete {
            background-color: #c73636;
            color: white;
        }
        .btn-delete:hover {
            background-color: #e04242;
        }
        #file-tree {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }
        .tree-node {
            margin-left: 14px;
            user-select: none;
        }
        .node-element {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .node-element:hover {
            background-color: #29292e;
        }
        .node-element.active {
            background-color: #202024;
            border-left: 3px solid #00875f;
        }
        .node-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .node-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #121214;
        }
        #tab-bar {
            height: 45px;
            background-color: #1a1a1e;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #29292e;
            font-size: 14px;
            color: #c4c4cc;
        }
        #code-editor {
            flex: 1;
            width: 100%;
            background-color: #121214;
            color: #e1e1e6;
            border: none;
            padding: 20px;
            font-family: "Fira Code", Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        #preview-panel {
            height: 35%;
            background-color: #1a1a1e;
            border-top: 2px solid #29292e;
            display: flex;
            flex-direction: column;
        }
        #preview-title {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #8d8d99;
            background-color: #141416;
            border-bottom: 1px solid #29292e;
        }
        #preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="toolbar">
            <button class="btn" onclick="createNewElement('file')">+ Archivo</button>
            <button class="btn" onclick="createNewElement('folder')">+ Carpeta</button>
            <button class="btn btn-delete" onclick="deleteSelectedElement()">Eliminar</button>
            <button class="btn btn-play" onclick="runCode()">▶ Play</button>
        </div>
        <div id="file-tree"></div>
    </div>

    <div id="main-container">
        <div id="editor-container">
            <div id="tab-bar">Ningún archivo seleccionado</div>
            <textarea id="code-editor" readonly placeholder="Selecciona o crea un archivo para comenzar..."></textarea>
        </div>
        <div id="preview-panel">
            <div id="preview-title">Consola / Vista Previa de Ejecución</div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const iconFolderUrl = "https://www.svgrepo.com/show/530518/folder.svg";
        const iconFileUrl = "https://www.svgrepo.com/show/530516/document.svg";

        let virtualFS = {
            "index.html": { type: "file", content: "<!DOCTYPE html>\n<html>\n<body>\n  <h1>Proyecto Virtual</h1>\n  <p>Prueba a escribir código y pulsar Play.</p>\n  <script>\n    console.log('¡Hola desde el entorno virtual!');\n    alert('Código ejecutado');\n  </" + "script>\n</body>\n</html>" }
        };

        let selectedPath = null;
        let currentOpenPath = null;
        
        const fileTreeContainer = document.getElementById("file-tree");
        const tabBar = document.getElementById("tab-bar");
        const codeEditor = document.getElementById("code-editor");
        const previewFrame = document.getElementById("preview-frame");

        function buildTree(fs) {
            let root = {};
            for (let path in fs) {
                let parts = path.split('/');
                let current = root;
                for (let i = 0; i < parts.length; i++) {
                    let part = parts[i];
                    if (!current[part]) {
                        current[part] = { _meta: i === parts.length - 1 ? fs[path] : { type: "folder" }, _children: {} };
                    }
                    current = current[part]._children;
                }
            }
            return root;
        }

        function renderTree(tree, container, currentPath = "") {
            for (let key in tree) {
                let node = tree[key]._meta;
                let children = tree[key]._children;
                let fullPath = currentPath ? `${currentPath}/${key}` : key;

                let div = document.createElement("div");
                div.className = "tree-node";

                let element = document.createElement("div");
                element.className = "node-element";
                if (selectedPath === fullPath) element.classList.add("active");
                
                const iconSrc = node.type === 'folder' ? iconFolderUrl : iconFileUrl;
                const iconHtml = `<img src="${iconSrc}" class="node-icon" alt="${node.type}">`;

                element.innerHTML = `<div class="node-info">${iconHtml}<span>${key}</span></div>`;

                element.addEventListener("click", (e) => {
                    e.stopPropagation();
                    selectElement(fullPath, element, node.type);
                });

                div.appendChild(element);

                if (Object.keys(children).length > 0) {
                    let childrenContainer = document.createElement("div");
                    renderTree(children, childrenContainer, fullPath);
                    div.appendChild(childrenContainer);
                }

                container.appendChild(div);
            }
        }

        function refreshTree() {
            fileTreeContainer.innerHTML = "";
            const structuredTree = buildTree(virtualFS);
            renderTree(structuredTree, fileTreeContainer);
        }

        function selectElement(path, element, type) {
            document.querySelectorAll(".node-element").forEach(el => el.classList.remove("active"));
            element.classList.add("active");
            selectedPath = path;

            if (type === "file") {
                if (currentOpenPath) {
                    virtualFS[currentOpenPath].content = codeEditor.value;
                }
                currentOpenPath = path;
                tabBar.textContent = path;
                codeEditor.value = virtualFS[path].content;
                codeEditor.removeAttribute("readonly");
            }
        }

        function createNewElement(type) {
            let defaultName = type === "file" ? "nuevo_archivo.html" : "nueva_carpeta";
            let name = prompt(`Introduce el nombre del nuevo ${type === 'file' ? 'archivo' : 'carpeta'}:`, defaultName);
            
            if (!name) return;

            let path = name;
            if (selectedPath) {
                if (virtualFS[selectedPath] && virtualFS[selectedPath].type === "folder") {
                    path = `${selectedPath}/${name}`;
                } else {
                    let parts = selectedPath.split('/');
                    parts.pop();
                    if (parts.length > 0) {
                        path = `${parts.join('/')}/${name}`;
                    }
                }
            }

            if (virtualFS[path]) {
                alert("Ya existe un elemento con esa ruta.");
                return;
            }

            virtualFS[path] = {
                type: type,
                content: type === "file" ? "<!-- Código fuente -->" : undefined
            };

            refreshTree();
        }

        function deleteSelectedElement() {
            if (!selectedPath) {
                alert("Por favor, selecciona un archivo o carpeta para eliminar.");
                return;
            }

            if (confirm(`¿Estás seguro de que quieres eliminar '${selectedPath}'?`)) {
                for (let path in virtualFS) {
                    if (path === selectedPath || path.startsWith(selectedPath + "/")) {
                        delete virtualFS[path];
                    }
                }

                if (currentOpenPath && (currentOpenPath === selectedPath || currentOpenPath.startsWith(selectedPath + "/"))) {
                    currentOpenPath = null;
                    tabBar.textContent = "Ningún archivo seleccionado";
                    codeEditor.value = "";
                    codeEditor.setAttribute("readonly", "true");
                }

                selectedPath = null;
                refreshTree();
            }
        }

        function runCode() {
            if (!currentOpenPath) {
                alert("Abre un archivo para poder ejecutar su código.");
                return;
            }
            
            // Sincronizar el contenido actual del editor
            virtualFS[currentOpenPath].content = codeEditor.value;
            let code = codeEditor.value;

            // Inyección básica para capturar logs de consola del iframe y verlos en alertas o la ventana integrada
            let injection = `
                <script>
                    const _log = console.log;
                    console.log = function(...args) {
                        _log(...args);
                    };
                <\/script>
            `;

            let doc = previewFrame.contentWindow.document;
            doc.open();
            doc.write(injection + code);
            doc.close();
        }

        codeEditor.addEventListener("input", () => {
            if (currentOpenPath) {
                virtualFS[currentOpenPath].content = codeEditor.value;
            }
        });

        // Inicialización inicial
        refreshTree();
    </script>
</body>
</html>
