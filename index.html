<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Stats - Dandy's World</title>
    <style>
        :root {
            --bg-color: #100d1c;
            --card-bg: #1b1730;
            --panel-bg: #25203e;
            --purple: #a855f7;
            --yellow: #ffd166;
            --cyan: #55e6d1;
            --text: #ffffff;
            --muted: #b7b2d0;
            --border: #443760;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at top left, #30204b 0, transparent 45%),
                        radial-gradient(ellipse at bottom right, #13383d 0, transparent 38%),
                        var(--bg-color);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app-container {
            width: 100%;
            max-width: 520px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 2px solid var(--border);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), 0 0 28px rgba(168, 85, 247, 0.12);
        }
        h1 {
            margin: 0 0 22px;
            color: var(--yellow);
            text-align: center;
            font-size: 1.5rem;
            text-shadow: 0 0 18px rgba(255, 209, 102, 0.32);
        }
        .form-group { margin-bottom: 14px; }
        .tab-nav {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }
        .stars-panel {
            overflow-x: auto;
        }
        .stars-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 430px;
            text-align: center;
        }
        .stars-table th, .stars-table td {
            padding: 10px 6px;
            border-bottom: 1px solid var(--border);
        }
        .stars-table th { color: var(--yellow); }
        .stars-table td:first-child, .stars-table th:first-child {
            text-align: left;
        }
        .stars-table td { color: var(--muted); }
        .stars-table .star-heading { color: var(--yellow); }
        .tab-btn {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-bg);
            color: var(--muted);
            font: inherit;
            cursor: pointer;
        }
        .tab-btn {
            transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s;
        }
        .tab-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            transform: translateY(-1px);
        }
        .tab-btn.active {
            border-color: var(--yellow);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.22), rgba(255, 209, 102, 0.1));
            color: var(--yellow);
        }
        .values-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .values-panel p { margin: 10px 0; color: var(--muted); }
        .values-panel strong { color: var(--text); }
        .values-panel .secondary-btn { margin-top: 12px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--muted);
        }
        select, input {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--panel-bg);
            color: white;
            font-size: 1rem;
            accent-color: var(--purple);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(85, 230, 209, 0.15);
        }
        .star-label { margin-top: 4px; }
        .star-selector {
            display: flex;
            justify-content: space-around;
            background-color: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0 16px;
            border: 1px solid var(--border);
        }
        .star-btn {
            background: none;
            border: none;
            color: #444a6d;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            padding: 0 5px;
        }
        .star-btn:hover { color: var(--cyan); transform: scale(1.12); }
        .star-btn.active { color: var(--yellow); transform: scale(1.12); }
        .result-box {
            background: linear-gradient(145deg, rgba(168, 85, 247, 0.13), rgba(85, 230, 209, 0.07)), var(--panel-bg);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--yellow);
            box-shadow: 0 0 18px rgba(255, 209, 102, 0.08);
            margin-top: 18px;
        }
        .big-val { font-size: 1.6rem; color: var(--yellow); font-weight: bold; }
        #starOutput { margin-top: 5px; }
        .movement-result-item { margin-top: 12px; }
        .movement-result-item .big-val { margin-left: 4px; }
        .modifier-summary {
            margin-top: 16px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: left;
        }
        .modifier-summary summary {
            color: var(--yellow);
            cursor: pointer;
            font-weight: bold;
        }
        .modifier-summary p { margin: 10px 0 0; color: var(--muted); }
        .modifier-entry {
            margin: 10px 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
        }
        .modifier-entry p { margin: 0 0 10px; }
        .remove-modifier { padding: 7px; color: #ffb3b3; }
        .secondary-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(168, 85, 247, 0.06);
            color: var(--muted);
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }
        .secondary-btn:hover {
            border-color: var(--cyan);
            background: rgba(85, 230, 209, 0.09);
            color: var(--cyan);
        }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 18px 15px; }
            h1 { font-size: 1.3rem; }
            .star-btn { font-size: 1.8rem; }
            .stars-panel { padding: 14px 10px; }
            .stars-table { min-width: 0; display: block; }
            .stars-table thead { display: none; }
            .stars-table tbody { display: grid; gap: 10px; }
            .stars-table tr {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: rgba(168, 85, 247, 0.08);
            }
            .stars-table th, .stars-table td {
                border: 0;
                padding: 5px 2px;
            }
            .stars-table th:first-child { text-align: left; }
            .stars-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                text-align: right;
                overflow-wrap: anywhere;
            }
            .stars-table td::before {
                content: attr(data-label);
                color: var(--muted);
                text-align: left;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <main class="app-container">
        <section class="card" aria-labelledby="title">
            <h1 id="title">Calculadora de Stats</h1>
            <div class="tab-nav" role="tablist" aria-label="Secciones de la calculadora">
                <button class="tab-btn active" type="button" id="calculatorTab" role="tab" aria-selected="true">Calculadora</button>
                <button class="tab-btn" type="button" id="valuesTab" role="tab" aria-selected="false">Valores aplicados</button>
                <button class="tab-btn" type="button" id="starsTab" role="tab" aria-selected="false">Estrellas elegidas</button>
            </div>

            <div id="calculatorPanel" role="tabpanel" aria-labelledby="calculatorTab">
            <div class="form-group">
                <label for="statType">Selecciona estadística:</label>
                <select id="statType">
                    <option value="extraction">Extraction Speed (Velocidad de Extracción)</option>
                    <option value="movement">Movement Speed (Walk + Run)</option>
                    <option value="skillcheck">Skill Check Size (Tamaño de Acierto)</option>
                    <option value="stamina">Stamina (Aguante Máximo)</option>
                    <option value="stealth">Stealth (Sigilo)</option>
                </select>
            </div>

            <label class="star-label">Seleccionar nivel objetivo (1 - 5 estrellas):</label>
            <div class="star-selector" id="starSelector">
                <button class="star-btn" type="button" data-star="1" aria-label="1 estrella">★</button>
                <button class="star-btn" type="button" data-star="2" aria-label="2 estrellas">★</button>
                <button class="star-btn active" type="button" data-star="3" aria-label="3 estrellas">★</button>
                <button class="star-btn" type="button" data-star="4" aria-label="4 estrellas">★</button>
                <button class="star-btn" type="button" data-star="5" aria-label="5 estrellas">★</button>
            </div>

            <div class="form-group" id="singleBaseGroup">
                <label for="baseVal">Valor base del Toon:</label>
                <input type="number" id="baseVal" step="0.01" value="1.00">
            </div>
            <div class="form-group" id="movementBaseGroup" hidden>
                <label for="walkBase">Velocidad base Walk:</label>
                <input type="number" id="walkBase" step="0.1" value="15">
                <label for="runBase" style="margin-top: 10px;">Velocidad base Run:</label>
                <input type="number" id="runBase" step="0.1" value="25">
            </div>
            <div class="form-group" id="movementTargetGroup" hidden>
                <label for="movementTarget">Aplicar modificadores a:</label>
                <select id="movementTarget">
                    <option value="both">Walk y Run</option>
                    <option value="walk">Solo Walk</option>
                    <option value="run">Solo Run</option>
                    <option value="none">Ninguno</option>
                </select>
            </div>
            <div class="form-group">
                <label for="multiplier">Multiplicador (×):</label>
                <input type="number" id="multiplier" step="0.01" value="1.00">
            </div>
            <div class="form-group">
                <label for="percent">Modificador porcentaje (%):</label>
                <input type="number" id="percent" step="0.1" value="0">
            </div>
            <div class="form-group">
                <label for="flat">Valor plano (+ / -):</label>
                <input type="number" id="flat" step="1" value="0">
            </div>
            <button class="secondary-btn" type="button" id="addModifier">Añadir modificador</button>
            <button class="secondary-btn" type="button" id="clearModifiers">Quitar todos los modificadores</button>

            <div class="result-box" aria-live="polite">
                <div id="singleResult">
                    <div>Valor calculado final:</div>
                    <div class="big-val" id="finalVal">1.00</div>
                    <div id="starOutput">Equivale a: ★★★☆☆ (3 estrellas)</div>
                </div>
                <div id="movementResult" hidden>
                    <div>Velocidades calculadas:</div>
                    <div class="movement-result-item">
                        <strong>Walk:</strong> <span class="big-val" id="walkFinal">15.00</span>
                        <div id="walkStars"></div>
                    </div>
                    <div class="movement-result-item">
                        <strong>Run:</strong> <span class="big-val" id="runFinal">25.00</span>
                        <div id="runStars"></div>
                    </div>
                    <details class="modifier-summary">
                        <summary>Ver qué se aplicó a Walk y Run</summary>
                        <p id="walkModifierSummary"></p>
                        <p id="runModifierSummary"></p>
                    </details>
                </div>
            </div>
            </div>
            <div id="valuesPanel" class="values-panel" role="tabpanel" aria-labelledby="valuesTab" hidden>
                <h2>Valores aplicados</h2>
                <p id="appliedTarget"></p>
                <div id="modifierList" aria-live="polite"></div>
                <p id="appliedWalk"></p>
                <p id="appliedRun"></p>
                <p id="appliedSingle"></p>
                <button class="secondary-btn" type="button" id="clearModifiersDetails">Quitar todos los modificadores</button>
            </div>
            <div id="starsPanel" class="values-panel stars-panel" role="tabpanel" aria-labelledby="starsTab" hidden>
                <h2>Estrellas elegidas por estadística</h2>
                <p>Aquí puedes consultar el nivel que elegiste para cada estadística.</p>
                <div id="starsTableContainer"></div>
            </div>
        </section>
    </main>

    <script>
        const statTables = {
            extraction: [0.75, 0.85, 1.00, 1.20, 1.50],
            walk: [10, 12.5, 15, 17.5, 20],
            run: [20, 22.5, 25, 27.5, 30],
            skillcheck: [50, 100, 150, 200, 250],
            stamina: [100, 125, 150, 175, 200],
            stealth: [0, 5, 10, 15, 20]
        };

        const chosenStars = {
            extraction: 3,
            movement: 3,
            skillcheck: 3,
            stamina: 3,
            stealth: 3
        };

        function renderStarsTable() {
            const rows = [
                ['Extraction Speed', 'extraction'],
                ['Movement Speed — Walk', 'walk', 'movement'],
                ['Movement Speed — Run', 'run', 'movement'],
                ['Skill Check Size', 'skillcheck'],
                ['Stamina', 'stamina'],
                ['Stealth', 'stealth']
            ];
            const tableRows = rows.map(([label, stat, selection = stat]) => {
                const stars = chosenStars[selection];
                const value = statTables[stat][stars - 1];
                return `<tr><th scope="row">${label}</th><td class="star-heading" data-label="Estrellas elegidas">${formatStars(stars)}</td><td data-label="Valor">${value}</td></tr>`;
            }).join('');
            document.getElementById('starsTableContainer').innerHTML =
                `<table class="stars-table"><thead><tr><th scope="col">Estadística</th><th scope="col">Estrellas elegidas</th><th scope="col">Valor</th></tr></thead><tbody>${tableRows}</tbody></table>`;
        }

        function numericValue(id, fallback) {
            const value = Number(document.getElementById(id).value);
            return Number.isFinite(value) ? value : fallback;
        }

        function getStars(value, thresholds) {
            let stars = 1;
            thresholds.forEach((threshold, index) => {
                if (value >= threshold) stars = index + 1;
            });
            return stars;
        }

        function formatStars(stars) {
            const display = '★'.repeat(stars) + '☆'.repeat(5 - stars);
            return `${display} (${stars} estrella${stars === 1 ? '' : 's'})`;
        }

        const activeModifiers = [];
        const targetLabels = { both: 'Walk y Run', walk: 'solo Walk', run: 'solo Run', none: 'ninguno' };

        function effectFor(target, type) {
            const applicable = activeModifiers.filter(item => {
                if (item.stat !== type) return false;
                return type !== 'movement' || item.target === 'both' || item.target === target;
            });
            return applicable.reduce((effect, item) => {
                effect.multiplier *= item.multiplier * (1 + item.percent / 100);
                effect.flat += item.flat;
                return effect;
            }, { multiplier: 1, flat: 0 });
        }

        function renderModifierList() {
            const list = document.getElementById('modifierList');
            list.replaceChildren();
            if (activeModifiers.length === 0) {
                const empty = document.createElement('p');
                empty.textContent = 'Todavía no has añadido modificadores.';
                list.append(empty);
                return;
            }

            activeModifiers.forEach((item, index) => {
                const entry = document.createElement('div');
                entry.className = 'modifier-entry';
                const description = document.createElement('p');
                const destination = item.stat === 'movement' ? targetLabels[item.target] : item.statLabel;
                description.textContent = `#${index + 1} · Para: ${destination} · Multiplicador: ×${item.multiplier.toFixed(2)} · Porcentaje: ${item.percent}% · Valor plano: ${item.flat >= 0 ? '+' : ''}${item.flat}`;
                const remove = document.createElement('button');
                remove.className = 'secondary-btn remove-modifier';
                remove.type = 'button';
                remove.dataset.removeModifier = String(index);
                remove.textContent = 'Quitar este modificador';
                entry.append(description, remove);
                list.append(entry);
            });
        }

        function updateAppliedSummary(type, walk, run, single) {
            const isMovement = type === 'movement';
            const statLabel = document.getElementById('statType').selectedOptions[0].text;
            document.getElementById('appliedTarget').textContent = isMovement
                ? `Destino elegido para el próximo modificador: ${targetLabels[document.getElementById('movementTarget').value]}.`
                : `Estadística seleccionada: ${statLabel}.`;
            document.getElementById('appliedWalk').hidden = !isMovement;
            document.getElementById('appliedRun').hidden = !isMovement;
            document.getElementById('appliedSingle').hidden = isMovement;

            if (isMovement) {
                const walkBase = numericValue('walkBase', 0);
                const runBase = numericValue('runBase', 0);
                const walkValue = walkBase * walk.multiplier + walk.flat;
                const runValue = runBase * run.multiplier + run.flat;
                document.getElementById('appliedWalk').textContent =
                    `Walk — base: ${walkBase.toFixed(2)} · final: ${walkValue.toFixed(2)} · ${formatStars(getStars(walkValue, statTables.walk))}`;
                document.getElementById('appliedRun').textContent =
